name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "new version"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build bash_ls
        run: |
          zig build \
          -Doptimize=ReleaseFast \
          -Dmulti-targets \
          --summary all

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: zig-out/bin/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --generate-notes \
            --verify-tag \
            ./artifacts/*
